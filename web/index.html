<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Arinacave - All-in-one app">
  
  <!-- ====== UPDATED CSP WITH blob: SUPPORT ====== -->
  <meta http-equiv="Content-Security-Policy" 
        content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: gap: content: https://*.googleapis.com https://*.firebaseio.com https://*.google.com blob:; 
                 img-src * 'self' data: blob: https:; 
                 media-src * 'self' data: blob:; 
                 connect-src * 'self' https: ws: wss: data: blob:; 
                 style-src * 'self' 'unsafe-inline'; 
                 script-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Arinacave">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  
  <title>Arinacave</title>
  <link rel="manifest" href="manifest.json">
  <!-- REMOVE this viewport meta tag - Flutter will add its own -->
   <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"> -->
  
  <!-- ====== FIREBASE SCRIPTS ====== -->
  <!-- Load Firebase SDKs (compat version for Flutter web) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  
  <!-- Your Firebase configuration -->
  <script src="firebase_config.js"></script>
  <!-- ====== END FIREBASE SCRIPTS ====== -->
  
  <style id="splash-screen-style">
    html { height: 100% }
    body {
      margin: 0;
      min-height: 100%;
      background-color: #000000;
      background-size: 100% 100%;
    }
    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }
    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }
    .stretch {
      display:block;
      width:100%; height:100%;
    }
    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }
    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }
    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }
    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    .loader {
      width: 50px;
      height: 50px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #4a6cf7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    #loading p {
      color: #ffffff;
      margin-top: 20px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.getElementById("loading")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <!-- ====== SPLASH SCREEN ====== -->
  <div id="loading">
    <div class="loader"></div>
    <p>Loading ArinaCave...</p>
  </div>
  
  <picture id="splash">
    <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
    <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
    <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="ArinaCave Splash Screen">
  </picture>

  <!-- ====== FLUTTER WEB BOOTSTRAP ====== -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    window.addEventListener('load', function(ev) {
      _flutter.loader.load({
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
            
            // Remove loading screen after app starts
            setTimeout(function() {
              const loading = document.getElementById('loading');
              if (loading) {
                loading.style.opacity = '0';
                setTimeout(function() {
                  loading.remove();
                }, 500);
              }
            }, 1000);
          });
        }
      });
    });
    
    // Console branding
    console.log('%c ArinaCave ', 'background: #4a6cf7; color: white; font-size: 20px; font-weight: bold; padding: 10px;');
    console.log('%c All-in-One Social App | Made by Denis Marav ', 'color: #4a6cf7; font-size: 14px;');
  </script>
</body>
</html>
