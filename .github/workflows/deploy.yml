name: Deploy ArinaCave to GitHub Pages

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        run: |
          git clone \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git \
            --branch master \
            --single-branch \
            repo

      - name: Install Flutter
        run: |
          cd $HOME
          wget -q https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.29.0-stable.tar.xz
          tar xf flutter_linux_3.29.0-stable.tar.xz
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Enable web
        run: flutter config --enable-web

      - name: Install dependencies
        run: |
          cd $GITHUB_WORKSPACE/repo
          flutter pub get

      - name: Create firebase_config.js
        run: |
          cat > $GITHUB_WORKSPACE/repo/web/firebase_config.js << 'JSEOF'
          const firebaseConfig = {
              apiKey: "AIzaSyDUapVqUD9UieQ_4TSbLXF8f0rcibLNhMY",
              authDomain: "lifematters-c466d.firebaseapp.com",
              projectId: "lifematters-c466d",
              storageBucket: "lifematters-c466d.firebasestorage.app",
              messagingSenderId: "162639628951",
              appId: "1:162639628951:web:f718315479b7657e2637d2",
              measurementId: "G-899V77DEBH"
          };
          try {
              if (typeof firebase !== 'undefined') {
                  if (!firebase.apps.length) {
                      firebase.initializeApp(firebaseConfig);
                      console.log('Firebase initialized successfully');
                  } else {
                      console.log('Firebase already initialized');
                  }
                  firebase.auth().setPersistence(
                      firebase.auth.Auth.Persistence.LOCAL
                  ).catch((e) => console.error('Auth persistence error:', e));
              }
          } catch (error) {
              console.error('Firebase initialization error:', error);
          }
          JSEOF

      - name: Build Flutter web
        run: |
          cd $GITHUB_WORKSPACE/repo
          flutter build web \
            --base-href /arinacare/ \
            --release \
            --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
            --dart-define=NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}

      - name: Deploy to gh-pages
        run: |
          cd $GITHUB_WORKSPACE/repo/build/web
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "Deploy ArinaCave"
          git push --force \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git \
            gh-pages