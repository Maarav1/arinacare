name: Deploy ArinaCave to GitHub Pages

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Create firebase_config.js
        run: |
          cat > web/firebase_config.js << 'JSEOF'
          const firebaseConfig = {
            apiKey: "AIzaSyDUapVqUD9UieQ_4TSbLXF8f0rcibLNhMY",
            authDomain: "lifematters-c466d.firebaseapp.com",
            projectId: "lifematters-c466d",
            storageBucket: "lifematters-c466d.firebasestorage.app",
            messagingSenderId: "162639628951",
            appId: "1:162639628951:web:f718315479b7657e2637d2",
            measurementId: "G-899V77DEBH"
          };
          try {
            if (typeof firebase !== 'undefined') {
              if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
              }
              firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
            }
          } catch (error) {
            console.error('Firebase init error:', error);
          }
          JSEOF

      - name: Build Flutter web
        run: flutter build web --base-href /arinacare/ --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} --dart-define=NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web